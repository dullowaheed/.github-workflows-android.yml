
name: Build Urdu Caption Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q UrduCaptionStudio_Android_Source.zip -d .

      - name: Build APK
        run: gradle -p UrduCaptionStudio :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduCaptionStudio-debug-apk
          path: UrduCaptionStudio/app/build/outputs/apk/debug/app-debug.apk
          
